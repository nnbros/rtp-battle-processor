#####
# Main Spring settings
#####
spring:
    profiles:
        active: prod
    application.name: pve
    config:
        import: "classpath:/config/include.yml"

#####
# Gateway connection settings
#####
    cloud.openfeign.client.config:
        default:
            loggerLevel: basic
        gateway:
            url: "http://gateway:8080"
            path: "/api/v1/"
        storyteller:
            url: "http://storyteller:8085"
            path: "/api/v1/"

#####
# Data source configuration
#####
    datasource:
        hikari:
            data-source-properties:
                stringtype: unspecified
        url: jdbc:postgresql://postgres:5432/rtp
        username: ${DB_USER}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: false

    liquibase:
        liquibase-schema: pve
        change-log: liquibase/db.changelog-master.yaml
        url: ${spring.datasource.url}
        user: ${spring.datasource.username}
        password: ${spring.datasource.password}
        show-summary-output: all
        ui-service: LOGGER

#####
# Network settings
#####
server.port: 8090

#####
# Main StoryTeller settings
#####
rtp-bot.token: ${RTP_BOT_TOKEN}
pve:
    action-processor-thread-pool:
        min: 10
        max: 30
        queue: 10000
        await-termination-timeout: 5m
        thread-name-prefix: ActionPipeline-
    api:
        base-url: "/api/v1"
        actions-endpoint-prefix: "/actions"
    battle:
        max-active-skills: 3

battle-processor.scripts-path: "classpath:/app/scripts"
telegram.elements.working-directory: "classpath:/config/ui/elements"

#####
# Logging settings
#####
logging:
    level.org.springframework.boot.autoconfigure: ERROR
    file.name: /var/log/rtp/pve/pve.log
    spring.output.ansi.enabled: ALWAYS
    pattern.console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%t]){faint} %clr(%-40.40logger{39}){cyan} : %X{charId} %X{updateId} %m%n%wEx"
